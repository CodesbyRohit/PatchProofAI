[project]
name = "patchproof"
version = "0.1.0"
description = "PatchProof AI: evidence-driven AI debugging that verifies patches against real test runs."
authors = [
    { name = "Rohit Srivastava", email = "164725271+CodesbyRohit@users.noreply.github.com" }
]
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "pydantic>=2.14.1",
    "python-multipart>=0.0.32",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-timeout>=2.4.0",
    "ruff>=0.17.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 120
markers = [
    "docker: requires a running Docker daemon and the sandbox image",
    "live: performs a real BharatCode API request (needs BHARATCODE_API_KEY)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
# B008: FastAPI's File(...)/Depends(...) defaults are the framework idiom.
ignore = ["S101", "S603", "S607", "E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]
