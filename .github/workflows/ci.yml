name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:

# Read-only token. Nothing here deploys, publishes, or writes to the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff, pytest, Docker sandbox)
    runs-on: ubuntu-24.04
    # pytest with the Docker sandbox (~3 min) plus the benchmark (~4-5 min), with headroom.
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    env:
      # Normal CI never calls BharatCode: model behaviour is covered by scripted fake clients.
      BHARATCODE_API_KEY: ""
      # Turn a missing Docker sandbox into a failure instead of a skip.
      PATCHPROOF_REQUIRE_DOCKER: "1"
      # Expected number of real-Docker tests in tests/test_docker_sandbox.py.
      MIN_DOCKER_TESTS: "7"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.11.21"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies (locked)
        run: uv sync --locked

      - name: Ruff
        run: uv run --locked ruff check src tests

      - name: Build the execution sandbox image
        run: |
          docker version --format 'Docker {{.Server.Version}}'
          sh ../scripts/build-sandbox.sh

      - name: Pytest (full suite, including the Docker sandbox)
        run: uv run --locked pytest -q -rs --junitxml="$RUNNER_TEMP/pytest-results.xml"

      # Disables each security control in turn (CSRF, ownership, OAuth state, patch approval, archive host,
      # atomic quota, token refresh lock, token encryption) and requires its guarding test to fail.
      - name: Security mutation checks
        run: uv run --locked python scripts/mutation_check.py

      - name: Require Docker sandbox coverage
        run: |
          uv run --locked python - "$RUNNER_TEMP/pytest-results.xml" <<'EOF'
          import os, sys
          import xml.etree.ElementTree as ET

          cases = [c for c in ET.parse(sys.argv[1]).iter("testcase")
                   if c.get("classname", "").endswith("test_docker_sandbox")]
          bad = [c.get("name") for c in cases
                 if c.find("skipped") is not None or c.find("failure") is not None or c.find("error") is not None]
          need = int(os.environ["MIN_DOCKER_TESTS"])
          print(f"Docker sandbox tests run: {len(cases)} (required: at least {need}); not passing: {bad or 'none'}")
          if len(cases) < need or bad:
              sys.exit("Required Docker sandbox coverage is missing.")
          EOF

      # Scripted fixtures through the real engine and Docker sandbox; never calls the model.
      # Exits non-zero if any case's verdict or regression count differs from its expectation.
      - name: Benchmark
        run: uv run --locked python -m patchproof.benchmark --out "$RUNNER_TEMP/benchmark"

      # Mismatches (with the engine's reasons) and resource-limit warnings appear in the job summary;
      # the full per-case record is kept as an artifact. Benchmark results contain fixture output only.
      - name: Benchmark summary
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/benchmark/results.md" ]; then
            cat "$RUNNER_TEMP/benchmark/results.md" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-results
          path: ${{ runner.temp }}/benchmark/
          if-no-files-found: ignore
          retention-days: 14

  frontend:
    name: Frontend (lint, type-check, tests, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies (locked)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Production build
        run: npm run build
